[package]
name = "agentbox"
version = "0.1.0"
edition = "2021"
description = "Run agent harnesses in a copy-on-write filesystem view with kernel-level exec auditing"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libbpf-rs = "0.27"
libc = "0.2"
nix = { version = "0.30", features = ["mount", "sched", "process", "signal", "fs", "user", "hostname", "socket", "uio"] }
# --log-http: TLS-intercepting proxy
base64 = "0.22"
brotli = "8"
flate2 = "1"
httparse = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
libbpf-cargo = "0.27"

[profile.release]
lto = true
